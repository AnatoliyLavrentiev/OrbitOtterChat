name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop bundles
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      NEXT_PUBLIC_API_URL: https://orbitotterchat-production.up.railway.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatroom/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Build desktop release bundles
        run: ./scripts/build-desktop-release.sh

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            chatroom/src-tauri/target/release/bundle/deb/*.deb \
            chatroom/src-tauri/target/release/bundle/rpm/*.rpm \
            chatroom/src-tauri/target/release/bundle/appimage/*.AppImage \
            --title "OrbitOtterChat $RELEASE_TAG" \
            --notes "Desktop release built against the Railway backend at $NEXT_PUBLIC_API_URL." \
            --verify-tag \
            || gh release upload "$RELEASE_TAG" \
            chatroom/src-tauri/target/release/bundle/deb/*.deb \
            chatroom/src-tauri/target/release/bundle/rpm/*.rpm \
            chatroom/src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber
