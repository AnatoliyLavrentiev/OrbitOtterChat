name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatroom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatroom/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rtc
          POSTGRES_PASSWORD: rtc_pass
          POSTGRES_USER: rtc_user
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rtc_user -d rtc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://rtc_user:rtc_pass@localhost:5433/rtc
      JWT_SECRET: test-jwt-secret
      TEST_DATABASE_URL: postgres://rtc_user:rtc_pass@localhost:5433/rtc

    defaults:
      run:
        working-directory: backend/rtc_backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rtc_backend

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked
