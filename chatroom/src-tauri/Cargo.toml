[package]
name = "orbitotterchat"
version = "0.1.0"
description = "Real-time desktop and web chat client."
authors = ["Epitech MSC Pro Promo 2028 - T-DEV-600-REN_13"]
license = "MIT"
repository = "https://github.com/EpitechMscProPromo2028/T-DEV-600-REN_13"
homepage = "https://github.com/EpitechMscProPromo2028/T-DEV-600-REN_13"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
